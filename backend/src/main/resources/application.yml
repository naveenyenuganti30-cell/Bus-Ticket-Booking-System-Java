server:
  port: 8080

spring:
  application:
    name: bus-booking-system
  datasource:
    url: jdbc:h2:mem:busbookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Application Custom Properties
app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
  booking:
    rate-per-km-default: 1.85
    tax-percentage-default: 5.0
    sleeper-surcharge-percentage: 20.0
    upper-deck-surcharge-percentage: 10.0
    window-surcharge-percentage: 5.0
